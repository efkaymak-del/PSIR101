<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PSIR101 – The United Nations Lab</title>
<style>
:root{
  --bg:#f0f4f8;--card:#fff;--primary:#009edb;--primaryDk:#007ab8;
  --accent:#ffc107;--accentDk:#e0a800;--correct:#28a745;--wrong:#dc3545;
  --txt:#1a1a2e;--txtLight:#555;--radius:14px;--shadow:0 4px 18px rgba(0,0,0,.08);
  --topH:56px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);padding-top:var(--topH);}
.topbar{position:fixed;top:0;left:0;width:100%;height:var(--topH);background:linear-gradient(135deg,var(--primary),var(--primaryDk));color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:900;box-shadow:0 2px 8px rgba(0,0,0,.15);}
.topbar .title{font-size:1.05rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar .badges{display:flex;gap:10px;}
.topbar .badge{background:rgba(255,255,255,.2);padding:4px 10px;border-radius:20px;font-size:.8rem;font-weight:600;}
.tab-bar{display:flex;overflow-x:auto;gap:6px;padding:12px 12px 0;background:var(--bg);position:sticky;top:var(--topH);z-index:800;}
.tab-bar button{flex-shrink:0;padding:8px 14px;border:none;border-radius:var(--radius) var(--radius) 0 0;background:var(--card);color:var(--txtLight);font-size:.82rem;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;transition:.2s;}
.tab-bar button.active{color:var(--primary);border-bottom-color:var(--primary);background:#fff;}
.panel{display:none;padding:16px 12px 60px;max-width:860px;margin:auto;}
.panel.active{display:block;}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px;}
.card h2{font-size:1.15rem;margin-bottom:10px;color:var(--primaryDk);}
.card h3{font-size:1rem;margin-bottom:8px;color:var(--primary);}
.card p,.card li{font-size:.92rem;line-height:1.55;color:var(--txtLight);}
.card ul{margin-left:18px;margin-bottom:8px;}
.video-wrap{position:relative;padding-bottom:56.25%;height:0;margin:12px 0;border-radius:10px;overflow:hidden;}
.video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}
.q-block{background:#eef6fc;border-radius:10px;padding:14px;margin-top:12px;}
.q-block p.q-label{font-weight:700;color:var(--primaryDk);margin-bottom:6px;font-size:.9rem;}
.opt-btn{display:block;width:100%;text-align:left;padding:10px 14px;margin:5px 0;border:2px solid #dce3ea;border-radius:10px;background:#fff;cursor:pointer;font-size:.88rem;transition:.15s;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.correct{border-color:var(--correct);background:#e6f9ed;}
.opt-btn.wrong{border-color:var(--wrong);background:#fdeaea;}
.opt-btn.disabled{pointer-events:none;opacity:.85;}
.explain{display:none;margin-top:8px;padding:10px 14px;background:#fff8e1;border-left:4px solid var(--accent);border-radius:8px;font-size:.85rem;line-height:1.5;color:var(--txt);}
/* sorter / classifier zones */
.zone-container{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;}
.zone{flex:1 1 200px;min-height:120px;background:#f7fafc;border:2px dashed #c8d6e5;border-radius:var(--radius);padding:10px;transition:.2s;}
.zone.over{border-color:var(--primary);background:#eef6fc;}
.zone .z-title{font-weight:700;font-size:.85rem;color:var(--primary);margin-bottom:6px;text-align:center;}
.chip{display:inline-block;padding:8px 14px;margin:4px;border-radius:20px;font-size:.82rem;font-weight:600;cursor:grab;transition:.15s;user-select:none;}
.chip.src{background:#dbeafe;color:#1e40af;}
.chip.correct-chip{background:#d1fae5;color:#065f46;}
.chip.wrong-chip{background:#fee2e2;color:#991b1b;}
.chip-bank{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;min-height:40px;padding:6px;background:#f1f5f9;border-radius:10px;}
/* flip cards */
.flip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:14px;}
.flip-card{perspective:800px;height:200px;cursor:pointer;}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;}
.flip-card.flipped .flip-inner{transform:rotateY(180deg);}
.flip-front,.flip-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;}
.flip-front{background:linear-gradient(135deg,var(--primary),var(--primaryDk));color:#fff;font-weight:700;font-size:1rem;}
.flip-back{background:var(--card);border:2px solid var(--primary);transform:rotateY(180deg);font-size:.82rem;color:var(--txt);line-height:1.45;overflow-y:auto;}
/* veto sim */
.veto-scenario{border:2px solid #e2e8f0;border-radius:var(--radius);padding:16px;margin-bottom:16px;transition:.2s;}
.veto-scenario.resolved{opacity:.85;}
.p5-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0;}
.p5-cell{text-align:center;padding:8px 4px;border-radius:8px;font-size:.75rem;font-weight:600;}
.p5-cell.favour{background:#d1fae5;color:#065f46;}
.p5-cell.against{background:#fee2e2;color:#991b1b;}
.p5-cell.abstain{background:#fef3c7;color:#92400e;}
.veto-btns{display:flex;gap:8px;flex-wrap:wrap;}
.veto-btns button{padding:8px 16px;border:2px solid #dce3ea;border-radius:10px;background:#fff;cursor:pointer;font-weight:600;font-size:.85rem;transition:.15s;}
.veto-btns button:hover{border-color:var(--primary);}
.veto-btns button.correct{border-color:var(--correct);background:#e6f9ed;}
.veto-btns button.wrong{border-color:var(--wrong);background:#fdeaea;}
/* timeline */
.tl-slot{padding:10px 14px;margin:4px 0;background:#f1f5f9;border-radius:10px;cursor:grab;font-size:.85rem;font-weight:600;display:flex;align-items:center;gap:8px;user-select:none;transition:.15s;}
.tl-slot:active{background:#dbeafe;}
.tl-slot.correct-slot{background:#d1fae5;}
.tl-slot.wrong-slot{background:#fee2e2;}
.tl-number{width:24px;height:24px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.75rem;flex-shrink:0;}
/* stats */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:14px;}
.stat-card{background:linear-gradient(135deg,var(--primary),var(--primaryDk));color:#fff;padding:20px;border-radius:var(--radius);text-align:center;}
.stat-card .num{font-size:2rem;font-weight:800;}
.stat-card .label{font-size:.8rem;opacity:.85;margin-top:4px;}
.btn-primary{padding:10px 20px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-weight:700;cursor:pointer;font-size:.9rem;transition:.2s;}
.btn-primary:hover{background:var(--primaryDk);}
.btn-accent{padding:10px 20px;border:none;border-radius:10px;background:var(--accent);color:#1a1a2e;font-weight:700;cursor:pointer;font-size:.9rem;transition:.2s;}
.btn-accent:hover{background:var(--accentDk);}
.check-row{display:flex;justify-content:flex-end;margin-top:12px;}
.score-banner{padding:12px;border-radius:10px;text-align:center;font-weight:700;font-size:1rem;margin-top:14px;}
.score-banner.good{background:#d1fae5;color:#065f46;}
.score-banner.ok{background:#fef3c7;color:#92400e;}
.score-banner.bad{background:#fee2e2;color:#991b1b;}
@media(max-width:520px){
  .topbar .title{font-size:.88rem;}
  .tab-bar button{font-size:.72rem;padding:6px 10px;}
  .zone-container{flex-direction:column;}
  .p5-grid{grid-template-columns:repeat(3,1fr);}
  .flip-grid{grid-template-columns:1fr 1fr;}
  .stat-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>

let xp=0, streak=0, bestStreak=0;
let vidDone={}, activityScores={};

function addXP(n){xp+=n;streak++;if(streak>bestStreak)bestStreak=streak;document.getElementById('xpBadge').textContent=xp+' XP';document.getElementById('streakBadge').textContent='🔥 '+streak;}
function breakStreak(){streak=0;document.getElementById('streakBadge').textContent='🔥 0';}

/* =====================================================================
   BUILD TABS
   ===================================================================== */
(function buildTabs(){
  const bar=document.getElementById('tabBar');
  TABS.forEach((t,i)=>{
    const b=document.createElement('button');
    b.textContent=t.label;
    b.onclick=()=>switchTab(i);
    bar.appendChild(b);
  });
  switchTab(0);
})();

function switchTab(idx){
  document.querySelectorAll('.tab-bar button').forEach((b,i)=>b.classList.toggle('active',i===idx));
  document.querySelectorAll('.panel').forEach((p,i)=>p.classList.toggle('active',i===idx));
  // lazy build
  if(idx===0 && !document.getElementById('panelVideo').innerHTML) buildVideo();
  if(idx===1 && !document.getElementById('panelOrgans').innerHTML) buildOrgans();
  if(idx===2 && !document.getElementById('panelVeto').innerHTML) buildVeto();
  if(idx===3 && !document.getElementById('panelConflict').innerHTML) buildConflict();
  if(idx===4 && !document.getElementById('panelReform').innerHTML) buildReform();
  if(idx===5 && !document.getElementById('panelCyprus').innerHTML) buildCyprus();
  if(idx===6 && !document.getElementById('panelMatch').innerHTML) buildMatch();
  if(idx===7 && !document.getElementById('panelTimeline').innerHTML) buildTimeline();
  if(idx===8) buildStats();
}

function buildVideo(){
  const p=document.getElementById('panelVideo');
  let h='<div class="card"><h2>📹 Video & Reflections</h2><p>Watch each video, then answer the reflection questions. Earn <strong>10 XP</strong> per correct answer.</p></div>';
  VID_DATA.forEach(v=>{
    h+=`<div class="card" id="vid-${v.id}"><h3>Section ${v.id}: ${v.title}</h3><p>${v.desc}</p>`;
    h+=`<div class="video-wrap"><iframe src="https://www.youtube.com/embed/${v.yt}" allowfullscreen loading="lazy"></iframe></div>`;
    v.questions.forEach((q,qi)=>{
      h+=`<div class="q-block" id="vq-${v.id}-${qi}"><p class="q-label">Q${qi+1}: ${q.q}</p>`;
      q.opts.forEach((o,oi)=>{
        h+=`<button class="opt-btn" onclick="handleVidQ('${v.id}',${qi},${oi})">${o}</button>`;
      });
      h+=`<div class="explain" id="vex-${v.id}-${qi}">${q.explain}</div></div>`;
    });
    h+=`</div>`;
  });
  p.innerHTML=h;
}

function handleVidQ(vid,qi,oi){
  const key=`vq-${vid}-${qi}`;
  if(vidDone[key]) return;
  vidDone[key]=true;
  const qData=VID_DATA.find(v=>v.id===vid).questions[qi];
  const block=document.getElementById(key);
  const btns=block.querySelectorAll('.opt-btn');
  btns.forEach((b,i)=>{
    b.classList.add('disabled');
    if(i===qData.correct) b.classList.add('correct');
    if(i===oi && oi!==qData.correct) b.classList.add('wrong');
  });
  document.getElementById(`vex-${vid}-${qi}`).style.display='block';
  if(oi===qData.correct) addXP(10); else breakStreak();
}

function buildVeto(){
  const p=document.getElementById('panelVeto');
  let h='<div class="card"><h2>🛡️ Veto Simulator</h2><p>You are an analyst watching the Security Council vote. For each draft resolution, examine the P5 positions and predict the outcome. Earn <strong>20 XP</strong> per correct prediction.</p><p style="margin-top:8px;font-size:.85rem;color:var(--primary)"><strong>Key rule:</strong> An ABSTENTION by a P5 member does NOT count as a veto. Only a "NO" vote blocks a resolution.</p></div>';
  VETO_DATA.forEach((v,i)=>{
    h+=`<div class="veto-scenario card" id="vs-${i}"><h3>${v.title}</h3><p style="font-size:.88rem">${v.desc}</p>`;
    h+=`<div class="p5-grid">`;
    Object.entries(v.p5).forEach(([country,pos])=>{
      const cls=pos==='IN FAVOUR'?'favour':pos==='AGAINST'?'against':'abstain';
      h+=`<div class="p5-cell ${cls}"><div>${country}</div><div>${pos}</div></div>`;
    });
    h+=`</div><p style="font-weight:600;font-size:.88rem;margin-bottom:8px">What happens?</p><div class="veto-btns" id="vb-${i}">`;
    v.opts.forEach((o,oi)=>{
      h+=`<button onclick="handleVeto(${i},${oi})">${o}</button>`;
    });
    h+=`</div><div class="explain" id="vex2-${i}">${v.explain}</div></div>`;
  });
  p.innerHTML=h;
}

function handleVeto(si,oi){
  const key=`veto-${si}`;
  if(activityScores[key]!==undefined) return;
  activityScores[key]=oi===VETO_DATA[si].correct;
  const btns=document.querySelectorAll(`#vb-${si} button`);
  btns.forEach((b,i)=>{
    b.style.pointerEvents='none';
    if(i===VETO_DATA[si].correct) b.classList.add('correct');
    if(i===oi && oi!==VETO_DATA[si].correct) b.classList.add('wrong');
  });
  document.getElementById(`vex2-${si}`).style.display='block';
  document.getElementById(`vs-${si}`).classList.add('resolved');
  if(oi===VETO_DATA[si].correct) addXP(20); else breakStreak();
}

  p.innerHTML=h;
  // drag reorder
  const list=document.getElementById('tlList');
  let dragEl=null;
  list.querySelectorAll('.tl-slot').forEach(el=>{
    el.addEventListener('dragstart',()=>{dragEl=el;el.style.opacity='.5';});
    el.addEventListener('dragend',()=>{dragEl.style.opacity='1';});
    el.addEventListener('dragover',e=>e.preventDefault());
    el.addEventListener('drop',e=>{
      e.preventDefault();
      if(dragEl!==el) list.insertBefore(dragEl,el);
      list.querySelectorAll('.tl-number').forEach((n,i)=>n.textContent=i+1);
    });
  });
}

function checkTimeline(){
  const slots=document.querySelectorAll('#tlList .tl-slot');
  let correct=0;
  const sorted=[...TL_DATA].sort((a,b)=>a.year-b.year);
  slots.forEach((s,i)=>{
    if(parseInt(s.dataset.year)===sorted[i].year){correct++;s.classList.add('correct-slot');s.classList.remove('wrong-slot');}
    else{s.classList.add('wrong-slot');s.classList.remove('correct-slot');}
  });
  const pct=Math.round(correct/sorted.length*100);
  const cls=pct>=80?'good':pct>=50?'ok':'bad';
  document.getElementById('tlResult').innerHTML=`<div class="score-banner ${cls}">${correct}/${sorted.length} in correct position (${pct}%)</div>`;
  if(pct===100) addXP(20); else if(correct>0) addXP(correct); if(pct<100) breakStreak();
}

/* =====================================================================
   DRAG-DROP HELPER (for chip-bank sorters)
   ===================================================================== */
function setupDragDrop(bankId){
  const panel=document.getElementById(bankId).closest('.panel')||document.getElementById(bankId).closest('.card').parentElement;
  panel.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('dragstart',e=>{
      e.dataTransfer.setData('text/plain','');
      chip.classList.add('dragging');
    });
    chip.addEventListener('dragend',()=>chip.classList.remove('dragging'));
  });
  panel.querySelectorAll('.zone').forEach(zone=>{
    zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('over');});
    zone.addEventListener('dragleave',()=>zone.classList.remove('over'));
    zone.addEventListener('drop',e=>{
      e.preventDefault();zone.classList.remove('over');
      const c=document.querySelector('.chip.dragging');
      if(c) zone.appendChild(c);
    });
  });
  const bank=document.getElementById(bankId);
  bank.addEventListener('dragover',e=>{e.preventDefault();});
  bank.addEventListener('drop',e=>{
    e.preventDefault();
    const c=document.querySelector('.chip.dragging');
    if(c) bank.appendChild(c);
  });
}
